        <text x="20" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Comparison across NHS acute &amp; community wards</text>

        <!-- Chart Grid Lines -->
        <g stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3,3" transform="translate(30, 80)">
          <line x1="0" y1="40" x2="380" y2="40"/>
          <line x1="0" y1="100" x2="380" y2="100"/>
          <line x1="0" y1="160" x2="380" y2="160"/>
          <line x1="0" y1="220" x2="380" y2="220"/>
          <line x1="0" y1="280" x2="380" y2="280"/>
        </g>

        <!-- Area fill 1 -->
        <path d="M 50,300 C 110,240 160,260 210,170 C 260,110 310,130 360,90 L 360,360 L 50,360 Z" fill="url(#chartGrad)"/>
        <!-- Line 1 (Fulfilled) -->
        <path d="M 50,300 C 110,240 160,260 210,170 C 260,110 310,130 360,90" fill="none" stroke="#4E8CFF" stroke-width="3"/>
        <circle cx="210" cy="170" r="5" fill="#ffffff" stroke="#4E8CFF" stroke-width="3"/>
        <circle cx="360" cy="90" r="5" fill="#ffffff" stroke="#4E8CFF" stroke-width="3"/>

        <!-- Tooltip box over node -->
