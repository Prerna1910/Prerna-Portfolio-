          <text x="175" y="21" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">DEPARTMENT</text>
          <text x="280" y="21" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">SHIFT</text>
          <text x="345" y="21" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">STATUS</text>
        </g>

        <!-- Table Rows -->
        <!-- Row 1 -->
        <g transform="translate(20, 115)">
          <rect width="395" height="52" rx="6" fill="#121524" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <circle cx="24" cy="26" r="12" fill="#4E8CFF" opacity="0.2"/>
          <text x="24" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#79C0FF" text-anchor="middle">LR</text>
          <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Lead Radiographer</text>
          <text x="46" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Band 7 • Specialist</text>

          <text x="175" y="30" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">Oncology Ward</text>
          <text x="280" y="30" font-family="-apple-system, sans-serif" font-size="11" font-mono fill="#94a3b8">12h Night</text>

          <rect x="338" y="16" width="48" height="20" rx="6" fill="rgba(34,197,94,0.15)"/>
          <text x="362" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">Filled</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(20, 175)">
          <rect width="395" height="52" rx="6" fill="#121524" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <circle cx="24" cy="26" r="12" fill="#9B72CF" opacity="0.2"/>
          <text x="24" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">SR</text>
          <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Specialist Registrar</text>
          <text x="46" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Band 8A • Paediatrics</text>

          <text x="175" y="30" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">A&amp;E Trauma</text>
          <text x="280" y="30" font-family="-apple-system, sans-serif" font-size="11" font-mono fill="#94a3b8">8h Day</text>

          <rect x="335" y="16" width="54" height="20" rx="6" fill="rgba(78,140,255,0.15)"/>
          <text x="362" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#79C0FF" text-anchor="middle">Review</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(20, 235)">
          <rect width="395" height="52" rx="6" fill="#121524" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <circle cx="24" cy="26" r="12" fill="#38bdf8" opacity="0.2"/>
          <text x="24" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">ST</text>
          <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">SEN Lead Teacher</text>
          <text x="46" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Education MAT Hub</text>

          <text x="175" y="30" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">Academy Trust</text>
          <text x="280" y="30" font-family="-apple-system, sans-serif" font-size="11" font-mono fill="#94a3b8">Full Term</text>

          <rect x="338" y="16" width="48" height="20" rx="6" fill="rgba(34,197,94,0.15)"/>
          <text x="362" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">Filled</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(20, 295)">
          <rect width="395" height="52" rx="6" fill="#121524" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <circle cx="24" cy="26" r="12" fill="#22c55e" opacity="0.2"/>
          <text x="24" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">CM</text>
          <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Clinical Matron</text>
          <text x="46" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Band 7 • Critical Care</text>

          <text x="175" y="30" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">ICU Unit</text>
          <text x="280" y="30" font-family="-apple-system, sans-serif" font-size="11" font-mono fill="#94a3b8">Twilight</text>

          <rect x="338" y="16" width="48" height="20" rx="6" fill="rgba(34,197,94,0.15)"/>
          <text x="362" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">Filled</text>
        </g>
      </g>
    </g>
  </g>
</svg>
