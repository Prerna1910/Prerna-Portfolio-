<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="50%" stop-color="#0f121e"/>
      <stop offset="100%" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B72CF"/>
      <stop offset="100%" stop-color="#4E8CFF"/>
    </linearGradient>
    <linearGradient id="activeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1c2e"/>
      <stop offset="100%" stop-color="#141525"/>
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Desktop Browser Window Frame -->
  <g filter="url(#winShadow)">
    <rect x="30" y="25" width="1140" height="700" rx="16" fill="#0d0f19" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Window Chrome Topbar -->
    <rect x="30" y="25" width="1140" height="46" rx="16" fill="#131622"/>
    <rect x="30" y="55" width="1140" height="16" fill="#131622"/>
    <line x1="30" y1="71" x2="1170" y2="71" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Traffic lights -->
    <circle cx="56" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="76" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="96" cy="48" r="6" fill="#27c93f"/>

    <!-- Navigation / URL Bar -->
    <rect x="135" y="36" width="500" height="25" rx="6" fill="#080a11" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="152" cy="48" r="3.5" fill="#22c55e"/>
    <text x="166" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">https://wms.cadogantate.com/quotations/new-contract?step=storage</text>

    <!-- Header status tag -->
    <rect x="990" y="37" width="160" height="23" rx="6" fill="rgba(155,114,207,0.15)" stroke="rgba(155,114,207,0.3)" stroke-width="1"/>
    <text x="1070" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">LONDON LHR BONDED</text>
  </g>

  <!-- Stepper Progress Header -->
  <g transform="translate(60, 92)">
    <rect width="1080" height="42" rx="8" fill="#111422" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Step 1 -->
    <g transform="translate(30, 12)">
      <circle cx="9" cy="9" r="8" fill="#22c55e"/>
      <path d="M 6,9 L 8.5,11.5 L 12.5,6.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="24" y="13" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">1. Consignment Specs</text>
    </g>

    <line x1="210" y1="21" x2="270" y2="21" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Step 2 (Active) -->
    <g transform="translate(290, 12)">
      <circle cx="9" cy="9" r="9" fill="url(#purpleGold)"/>
      <text x="9" y="13" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="26" y="13" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. Warehouse Storage Tier</text>
      <rect x="180" y="2" width="56" height="15" rx="4" fill="#9B72CF"/>
      <text x="208" y="13" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ACTIVE</text>
    </g>

    <line x1="560" y1="21" x2="620" y2="21" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Step 3 -->
    <g transform="translate(640, 12)">
      <circle cx="9" cy="9" r="9" fill="#1b1f30" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="9" y="13" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">3</text>
      <text x="26" y="13" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">3. Transport &amp; Handling</text>
    </g>

    <line x1="830" y1="21" x2="890" y2="21" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Step 4 -->
    <g transform="translate(910, 12)">
      <circle cx="9" cy="9" r="9" fill="#1b1f30" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="9" y="13" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">4</text>
      <text x="26" y="13" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">4. Final Quotation</text>
    </g>
  </g>

  <!-- 2-Column Main WMS Quotation App View -->
  <g transform="translate(60, 150)">
    <!-- Left Column: Quotation Configurator (660px) -->
    <g>
      <rect width="660" height="550" rx="14" fill="#0f121d" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Section Title -->
      <g transform="translate(25, 24)">
        <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Select Vault Storage Environment</text>
        <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Museum-standard climate controls &amp; high-security options</text>
      </g>

      <!-- Facility Option Cards -->
      <g transform="translate(25, 75)">
        <!-- Card 1: Fine Art Climate Vault (Selected) -->
        <g>
          <rect width="295" height="120" rx="10" fill="url(#activeCard)" stroke="#9B72CF" stroke-width="1.8"/>
          <!-- Checkmark badge -->
          <circle cx="270" cy="24" r="9" fill="#9B72CF"/>
          <path d="M 266,24 L 269,27 L 274,21" fill="none" stroke="#ffffff" stroke-width="2"/>

          <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Fine Art Climate Vault</text>
          <text x="18" y="46" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#c084fc">21°C Constant • 50% Relative Humidity</text>
          
          <line x1="18" y1="58" x2="277" y2="58" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          
          <text x="18" y="78" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Direct inert gas suppression &amp; Tier-4 CCTV</text>
          <text x="18" y="102" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">£1.85 <tspan font-size="10" font-weight="400" fill="#94a3b8">/ cu. ft / month</tspan></text>
        </g>

        <!-- Card 2: Bonded Secure Staging -->
        <g transform="translate(315, 0)">
          <rect width="295" height="120" rx="10" fill="#111420" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Bonded Customs Staging</text>
          <text x="18" y="46" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">HMRC Regulated bonded airside transfer</text>
          
          <line x1="18" y1="58" x2="277" y2="58" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          
          <text x="18" y="78" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Exempt from import duty during storage</text>
          <text x="18" y="102" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">£1.40 <tspan font-size="10" font-weight="400" fill="#94a3b8">/ cu. ft / month</tspan></text>
        </g>
      </g>

      <!-- Volume Slider Module -->
      <g transform="translate(25, 215)">
        <rect width="610" height="140" rx="10" fill="#121524" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Consignment Volume Calculation</text>
        <text x="20" y="46" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">Adjust required cubic racking capacity</text>

        <!-- Volume readout badge -->
        <rect x="420" y="16" width="170" height="34" rx="6" fill="#1a1e32" stroke="#9B72CF" stroke-width="1"/>
        <text x="505" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#c084fc" text-anchor="middle">2,450 cu. ft <tspan font-size="10" fill="#94a3b8">(69.3 m³)</tspan></text>

        <!-- Slider Bar -->
        <g transform="translate(20, 78)">
          <!-- Background track -->
          <rect width="570" height="8" rx="4" fill="#1e2238"/>
          <!-- Active fill -->
          <rect width="280" height="8" rx="4" fill="url(#purpleGold)"/>
          <!-- Thumb -->
          <circle cx="280" cy="4" r="11" fill="#ffffff" stroke="#9B72CF" stroke-width="3" filter="url(#winShadow)"/>
          
          <!-- Slider labels -->
          <text x="0" y="30" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">200 cu. ft</text>
          <text x="260" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#c084fc">2,450 cu. ft</text>
          <text x="520" y="30" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">5,000 cu. ft</text>
        </g>
      </g>

      <!-- Value Add Services Selector -->
      <g transform="translate(25, 375)">
        <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Specialist Logistics &amp; Preservation Add-ons</text>

        <g transform="translate(0, 30)">
          <!-- Item 1 -->
          <g>
            <rect width="195" height="60" rx="8" fill="#121524" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            <circle cx="20" cy="20" r="7" fill="#22c55e"/>
            <path d="M 17,20 L 19,22 L 23,18" fill="none" stroke="#ffffff" stroke-width="1.8"/>
            <text x="35" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Museum Crating</text>
            <text x="20" y="45" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Bespoke timber casing (+£340)</text>
          </g>

          <!-- Item 2 -->
          <g transform="translate(205, 0)">
            <rect width="195" height="60" rx="8" fill="#121524" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            <circle cx="20" cy="20" r="7" fill="#22c55e"/>
            <path d="M 17,20 L 19,22 L 23,18" fill="none" stroke="#ffffff" stroke-width="1.8"/>
            <text x="35" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Condition Report</text>
            <text x="20" y="45" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Digital UV photography (+£150)</text>
          </g>

          <!-- Item 3 -->
          <g transform="translate(410, 0)">
            <rect width="200" height="60" rx="8" fill="#121524" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            <circle cx="20" cy="20" r="7" fill="#22c55e"/>
            <path d="M 17,20 L 19,22 L 23,18" fill="none" stroke="#ffffff" stroke-width="1.8"/>
            <text x="35" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">White-Glove Staging</text>
            <text x="20" y="45" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Private viewing room (+£220)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Right Column: Live Quotation Summary & Breakdown (400px) -->
    <g transform="translate(680, 0)">
      <rect width="400" height="550" rx="14" fill="#101322" stroke="rgba(155,114,207,0.3)" stroke-width="1.5"/>

      <!-- Header -->
      <g transform="translate(24, 24)">
        <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Quotation Summary</text>
        <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Ref: CT-WMS-2024-8842</text>
        <rect x="250" y="4" width="100" height="24" rx="6" fill="rgba(34,197,94,0.15)"/>
        <text x="300" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">VALIDATED</text>
      </g>

      <!-- Cost Lines -->
      <g transform="translate(24, 85)">
        <rect width="352" height="220" rx="8" fill="#141728" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        
        <!-- Line 1 -->
        <g transform="translate(16, 28)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Fine Art Climate Vault (2,450 cu. ft)</text>
          <text x="320" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">£2,266.25</text>
        </g>

        <!-- Line 2 -->
        <g transform="translate(16, 64)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">HVAC &amp; Humidity Precision SLA</text>
          <text x="320" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">£380.00</text>
        </g>

        <!-- Line 3 -->
        <g transform="translate(16, 100)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Museum Timber Crating Package</text>
          <text x="320" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">£340.00</text>
        </g>

        <!-- Line 4 -->
        <g transform="translate(16, 136)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Condition Report with UV Imaging</text>
          <text x="320" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">£150.00</text>
        </g>

        <!-- Line 5 -->
        <g transform="translate(16, 172)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Fine Art Insurance (Est. £3.2M cover)</text>
          <text x="320" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">£413.75</text>
        </g>
      </g>

      <!-- Total & Action Buttons -->
      <g transform="translate(24, 335)">
        <rect width="352" height="185" rx="10" fill="#151829" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        
        <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TOTAL ESTIMATED MONTHLY</text>
        <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff">£3,550.00</text>
        <text x="20" y="92" font-family="-apple-system, sans-serif" font-size="10" fill="#4ade80">Includes 15% 12-month contract incentive</text>

        <!-- Generate Quote Button -->
        <g transform="translate(20, 115)">
          <rect width="312" height="46" rx="10" fill="url(#purpleGold)"/>
          <text x="156" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Generate Official PDF Quote</text>
        </g>
      </g>
    </g>
  </g>
</svg>
