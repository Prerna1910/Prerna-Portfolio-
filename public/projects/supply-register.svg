        <rect width="210" height="90" rx="12" fill="#111422" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.5">NET AGENCY SAVINGS</text>
