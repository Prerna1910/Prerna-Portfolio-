          <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">342 Placements</text>
        </g>

        <!-- X Axis labels -->
        <g transform="translate(50, 385)" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">
          <text x="0" y="0">Mon</text>
          <text x="60" y="0">Tue</text>
          <text x="120" y="0">Wed</text>
          <text x="180" y="0">Thu</text>
          <text x="240" y="0">Fri</text>
          <text x="300" y="0">Sat</text>
        </g>
      </g>

