        <rect width="210" height="90" rx="12" fill="#111422" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.5">TOTAL SHIFTS FILLED</text>
        <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff">1,842</text>
        <rect x="128" y="42" width="66" height="20" rx="6" fill="rgba(34,197,94,0.15)"/>
        <text x="161" y="56" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">+14.2% MoM</text>
      </g>

      <!-- KPI 2 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="90" rx="12" fill="#111422" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.5">FULFILMENT SLA</text>
        <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#79C0FF">98.6%</text>
