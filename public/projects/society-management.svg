<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c13"/>
      <stop offset="50%" stop-color="#0e111d"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E8CFF"/>
      <stop offset="100%" stop-color="#9B72CF"/>
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Desktop Browser Window Frame -->
  <g filter="url(#winShadow)">
    <rect x="30" y="25" width="1140" height="700" rx="16" fill="#0d0f19" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect x="30" y="25" width="1140" height="46" rx="16" fill="#131622"/>
    <rect x="30" y="55" width="1140" height="16" fill="#131622"/>
    <line x1="30" y1="71" x2="1170" y2="71" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Traffic lights -->
    <circle cx="56" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="76" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="96" cy="48" r="6" fill="#27c93f"/>

    <!-- URL Bar -->
    <rect x="135" y="36" width="480" height="25" rx="6" fill="#080a11" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
