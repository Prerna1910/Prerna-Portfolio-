        <text x="16" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Saved under master vendor rate</text>
      </g>

      <!-- KPI 4 -->
      <g transform="translate(675, 0)">
        <rect width="210" height="90" rx="12" fill="#111422" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.5">COMPLIANCE PASS RATE</text>
        <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#34d399">100%</text>
        <text x="16" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#6ee7b7">Zero audit flags</text>
      </g>
    </g>

