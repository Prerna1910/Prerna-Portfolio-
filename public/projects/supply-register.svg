      <g transform="translate(450, 0)">
        <rect width="435" height="430" rx="14" fill="#101320" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Recent Shift Requisitions</text>
        <text x="20" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Automated dispatch matching against qualified bank</text>

