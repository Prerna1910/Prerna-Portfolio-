<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="50%" stop-color="#0f121d"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="geminiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E8CFF"/>
      <stop offset="100%" stop-color="#9B72CF"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E8CFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4E8CFF" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B72CF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B72CF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Desktop Browser Window Chrome -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="25" width="1140" height="700" rx="16" fill="#0d101a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Window Topbar -->
    <rect x="30" y="25" width="1140" height="46" rx="16" fill="#131724"/>
    <rect x="30" y="55" width="1140" height="16" fill="#131724"/>
    <line x1="30" y1="71" x2="1170" y2="71" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Traffic lights -->
    <circle cx="56" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="76" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="96" cy="48" r="6" fill="#27c93f"/>

    <!-- URL / Navigation Bar -->
    <rect x="135" y="36" width="460" height="25" rx="6" fill="#090b12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="152" cy="48" r="3.5" fill="#22c55e"/>
    <text x="166" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">https://app.supplyregister.uk/analytics/workforce-intelligence</text>

    <!-- App User Tag -->
    <rect x="1010" y="37" width="140" height="23" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="1025" cy="48" r="7" fill="#6366f1"/>
    <text x="1038" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">NHS Trust North ▼</text>
  </g>

  <!-- App Workspace (Sidebar + Main View) -->
  <!-- 1. Left Sidebar -->
  <g transform="translate(30, 71)">
    <rect width="210" height="654" fill="#0f121d" stroke-width="0"/>
    <line x1="210" y1="0" x2="210" y2="654" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Brand Header -->
    <g transform="translate(20, 24)">
      <rect width="32" height="32" rx="8" fill="url(#geminiBlue)"/>
      <text x="16" y="21" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SR</text>
      <text x="42" y="16" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">The Supply Register</text>
      <text x="42" y="28" font-family="-apple-system, sans-serif" font-size="9.5" fill="#64748b">Workforce Ecosystem</text>
    </g>

    <!-- Sidebar Navigation -->
    <g transform="translate(14, 80)">
      <!-- Nav Item 1 -->
      <rect width="182" height="36" rx="8" fill="transparent"/>
      <circle cx="18" cy="18" r="4" fill="#64748b"/>
      <text x="34" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Dashboard Overview</text>

      <!-- Nav Item 2 (Active) -->
      <g transform="translate(0, 44)">
        <rect width="182" height="36" rx="8" fill="rgba(78, 140, 255, 0.14)" stroke="rgba(78, 140, 255, 0.3)" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#4E8CFF"/>
        <text x="34" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Workforce Analytics</text>
        <rect x="156" y="12" width="18" height="13" rx="4" fill="#4E8CFF"/>
        <text x="165" y="22" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>
      </g>

      <!-- Nav Item 3 -->
      <g transform="translate(0, 88)">
        <text x="34" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Live Placements</text>
      </g>
      <!-- Nav Item 4 -->
      <g transform="translate(0, 126)">
        <text x="34" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Agency Rate Cards</text>
      </g>
      <!-- Nav Item 5 -->
      <g transform="translate(0, 164)">
        <text x="34" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Compliance &amp; Vetting</text>
      </g>
      <!-- Nav Item 6 -->
      <g transform="translate(0, 202)">
        <text x="34" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Invoicing &amp; Timesheets</text>
      </g>
    </g>

    <!-- System Status Bottom Card -->
    <g transform="translate(16, 560)">
      <rect width="178" height="68" rx="10" fill="#131624" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="20" cy="22" r="3.5" fill="#22c55e"/>
      <text x="30" y="25" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">NHS Bank API v4.2</text>
      <text x="20" y="44" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">Latency 28ms • All systems operational</text>
    </g>
  </g>

  <!-- 2. Main Content View -->
  <g transform="translate(240, 71)">
    <!-- Main Header Bar -->
    <g transform="translate(25, 20)">
      <text x="0" y="22" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Enterprise Client Portal</text>
      <text x="0" y="42" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Real-time candidate fulfilment, agency tier optimization, and spend analytics</text>

      <!-- Date Filter + Export Button -->
      <g transform="translate(620, 4)">
        <rect width="140" height="34" rx="8" fill="#141826" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">Current Month ▼</text>
        
        <rect x="150" y="0" width="120" height="34" rx="8" fill="url(#geminiBlue)"/>
        <text x="210" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Export Report</text>
